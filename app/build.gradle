plugins {
    id 'com.android.application'
}

def signingProps = new File(System.getProperty("user.home"), ".config/athena-keystores/randomstring-release.properties")

android {
    namespace 'com.flexiatom.randomstring'
    compileSdk 35

    defaultConfig {
        applicationId "com.flexiatom.randomstring"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        release {
            if (signingProps.exists()) {
                def props = new Properties()
                signingProps.withInputStream { props.load(it) }
                storeFile new File(props.getProperty('storeFile'))
                storePassword props.getProperty('storePassword')
                keyAlias props.getProperty('keyAlias')
                keyPassword props.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                systemProperty 'robolectric.dependency.repo.url',
                        'https://maven.aliyun.com/repository/central'
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
